[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "cochlear-rehab-backend"
version = "0.1.0"
description = "AI听觉康复助手 - 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.29",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "redis[hiredis]==4.6.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "PyJWT[crypto]==2.10.1",
    "bcrypt==5.0.0",
    "httpx==0.27.0",
    "loguru==0.7.2",
    "python-multipart==0.0.9",
    "arq==0.26.0",
    "dashscope==1.17.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "librosa==0.10.2",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "aiosqlite>=0.19.0",
]
oss = [
    "oss2>=2.17.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
